<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eadfcc">
<title>I'm Sorry ✏️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #35333b;
    --ink-soft: #6b6672;
    --paper: #fffdf5;
    --line: #cfe0f2;
    --margin: #f3a5a5;
    --pink: #ff7a9c;
    --pink-l: #ffd1dc;
    --hl-yellow: rgba(255, 226, 74, .6);
    --hl-pink: rgba(255, 122, 156, .35);
    --desk: #eadfcc;
    --mx: 74px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    color: var(--ink);
    background: radial-gradient(rgba(90, 60, 30, .07) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--desk);
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  .hidden { display: none !important; }

  /* ---------- the notebook page ---------- */
  .notebook {
    position: relative; overflow: hidden;
    width: min(820px, calc(100vw - 48px));
    height: min(calc(100vh - 48px), 940px); height: min(calc(100dvh - 48px), 940px);
    border-radius: 6px 14px 14px 6px;
    background:
      linear-gradient(90deg, transparent calc(var(--mx) - 12px), var(--margin) calc(var(--mx) - 12px), var(--margin) calc(var(--mx) - 10px), transparent calc(var(--mx) - 10px)),
      repeating-linear-gradient(180deg, transparent 0 33px, var(--line) 33px 34px) 0 18px,
      var(--paper);
    box-shadow: 0 1px 0 #fff inset, 0 30px 60px -28px rgba(70, 45, 20, .55), 0 6px 14px -6px rgba(70, 45, 20, .3);
  }
  .notebook::after { /* paper grain */
    content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .55;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .holes {
    position: absolute; left: 12px; top: 0; bottom: 0; width: 22px; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 11px 22px, var(--desk) 6px, rgba(0,0,0,.12) 7px, transparent 8px) 0 0 / 22px 46px repeat-y;
  }
  .washi {
    position: absolute; top: -6px; left: 50%; width: 150px; height: 30px; z-index: 4; pointer-events: none;
    transform: translateX(-50%) rotate(-2deg);
    background: repeating-linear-gradient(45deg, rgba(255, 150, 180, .55) 0 10px, rgba(255, 200, 215, .55) 10px 20px);
    box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }
  .pg-no {
    position: absolute; z-index: 4; top: calc(10px + var(--safe-t)); right: 18px;
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 22px; color: var(--ink-soft); transform: rotate(3deg);
  }
  @media (max-width: 640px), (max-height: 520px) {
    body { display: block; }
    .notebook { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
    :root { --mx: 44px; }
    .holes { display: none; }
  }

  /* ---------- steps & page turns ---------- */
  .step {
    position: absolute; inset: 0; z-index: 2;
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: calc(52px + var(--safe-t)) 22px calc(28px + var(--safe-b)) var(--mx);
    display: flex; flex-direction: column;
  }
  .step > .inner { margin: auto; width: 100%; max-width: 660px; }
  .step.enter { animation: pageIn .6s cubic-bezier(.2, .8, .2, 1) both; }
  .step.leave { animation: pageOut .5s ease-in forwards; pointer-events: none; z-index: 3; }
  @keyframes pageIn { from { opacity: 0; transform: translateX(14%) rotate(2.5deg); } }
  @keyframes pageOut { to { opacity: 0; transform: translateX(-34%) rotate(-7deg); transform-origin: left bottom; } }

  /* ---------- type ---------- */
  h1, h2 { font-family: 'Caveat', cursive; font-weight: 700; margin: 0 0 .25em; line-height: 1.05; }
  h1 { font-size: clamp(42px, 7vw, 64px); }
  h2 { font-size: clamp(34px, 5.4vw, 48px); }
  p { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.45; margin: 0 0 .6em; }
  .hl { background: linear-gradient(transparent 55%, var(--hl-yellow) 55%, var(--hl-yellow) 92%, transparent 92%); padding: 0 .12em; }
  .hl-pink { background: linear-gradient(transparent 55%, var(--hl-pink) 55%, var(--hl-pink) 92%, transparent 92%); }
  .soft { color: var(--ink-soft); }
  .small { font-size: 15px; }
  .center { text-align: center; }

  /* ---------- sketchy buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 4px 28px 6px;
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 27px; line-height: 1;
    background: #fff; border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 3px 4px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease, font-size .25s ease, padding .25s ease;
  }
  .btn:hover { transform: translate(-1px, -2px) rotate(-1deg); box-shadow: 4px 6px 0 var(--ink); }
  .btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-pink { background: var(--pink-l); }
  .btn-yellow { background: #fff3a6; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .link { font-size: 18px; color: var(--ink-soft); text-decoration: underline wavy; text-underline-offset: 4px; min-height: 40px; }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; margin-top: 22px; }

  /* ---------- sticky notes / tape ---------- */
  .sticky {
    position: relative; display: inline-block; background: var(--c, #fff59d);
    padding: 14px 18px 16px; transform: rotate(var(--r, -2deg));
    box-shadow: 0 12px 18px -12px rgba(60, 40, 10, .5);
    font-size: clamp(19px, 2.3vw, 22px); line-height: 1.35;
  }
  .sticky::before, .letter::before, .coupon::before {
    content: ''; position: absolute; top: -13px; left: 50%; width: 96px; height: 26px; transform: translateX(-50%) rotate(-3deg);
    background: repeating-linear-gradient(-45deg, rgba(160, 210, 255, .55) 0 8px, rgba(205, 230, 255, .55) 8px 16px);
  }

  /* ---------- layout ---------- */
  .split { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .art { position: relative; flex: none; }
  @media (min-width: 760px) and (min-height: 521px), (min-width: 700px) and (max-height: 520px) {
    .split { display: grid; grid-template-columns: auto 1fr; gap: 30px; align-items: center; text-align: left; }
    .split .actions { justify-content: flex-start; }
  }

  /* ---------- doodles ---------- */
  .ink path, .ink circle, .ink ellipse, .ink line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ink .thin { stroke-width: 2; }
  .ink .nostroke { stroke: none; }
  .boy { display: block; height: clamp(190px, 34vh, 300px); height: clamp(190px, 34dvh, 300px); aspect-ratio: 240 / 320; width: auto; overflow: visible; }
  .boy .b-arms-plead, .boy .b-arms-cheer, .boy .b-legs-kneel, .boy .e-happy, .boy .m-happy,
  .boy .tear2, .boy .stream, .boy .stitch, .boy .glow, .boy .sparks { display: none; }
  .boy.pose-plead .b-arms-hold, .boy.pose-cheer .b-arms-hold { display: none; }
  .boy.pose-plead .b-arms-plead, .boy.pose-cheer .b-arms-cheer { display: inline; }
  .boy.pose-cheer .e-sad, .boy.pose-cheer .m-sad, .boy.pose-cheer .brow, .boy.pose-cheer .tear1 { display: none; }
  .boy.pose-cheer .e-happy, .boy.pose-cheer .m-happy, .boy.pose-cheer .sparks { display: inline; }
  .boy.kneel .b-legs-stand { display: none; }
  .boy.kneel .b-legs-kneel { display: inline; }
  .boy.cry2 .tear2, .boy.stream .stream, .boy.healed .stitch, .boy.healed .glow { display: inline; }
  .boy .b-upper { transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  .boy.kneel .b-upper { transform: translateY(30px); }
  .boy .b-heart { transition: transform .6s cubic-bezier(.3, 1.4, .5, 1); transform: translate(120px, 198px); }
  .boy.pose-plead .b-heart { transform: translate(120px, 216px); }
  .boy.pose-cheer .b-heart { transform: translate(180px, 48px) scale(1.2); }
  .boy .b-heart-in { animation: beat 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .boy .e-sad { animation: blink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
  .boy .tear1 path, .boy .tear2 path { stroke: #4f9fd4; stroke-width: 1.5; }
  .boy .tear1, .boy .tear2 { animation: tear 1.9s ease-in infinite; transform-box: fill-box; }
  .boy .tear2 { animation-delay: .9s; }
  .boy .stream { stroke: #8fd0ff !important; stroke-width: 5 !important; opacity: .85; }
  .boy .crack { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s ease; }
  .boy .glow { animation: glow 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .boy.pose-cheer { animation: jump .75s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.12); } 50% { transform: scale(.97); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes tear { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  @keyframes glow { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.15); opacity: 1; } }
  @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .rain { stroke: #7fb4e0 !important; stroke-dasharray: 6 9; animation: rain .6s linear infinite; }
  @keyframes rain { to { stroke-dashoffset: -15; } }
  .cloud { position: absolute; width: 58%; left: 21%; top: -22%; }
  .deco { position: absolute; pointer-events: none; opacity: .9; }

  /* ---------- step 2: envelope + letter ---------- */
  .env-btn { display: block; margin: 64px auto 0; width: min(340px, 82%); animation: wob 2.4s ease-in-out infinite; transition: opacity .5s ease, transform .5s ease; }
  .env-btn svg { display: block; width: 100%; height: auto; overflow: visible; }
  .env-btn.gone { animation: none; opacity: 0; transform: translateY(40px) scale(.8); pointer-events: none; }
  @keyframes wob { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-4px); } }
  .flap { transform-box: fill-box; transform-origin: 50% 0; transition: transform .55s ease; }
  .flap.open { transform: scaleY(-1); }
  .env-letter { transition: transform .7s ease; }
  .env-letter.up { transform: translateY(-58px); }
  .tap-hint { font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; color: var(--pink); margin-top: 10px; animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(-4px); } }
  .letter {
    position: relative; text-align: left; margin: 14px auto 0; max-width: 600px;
    padding: 26px 24px 18px 30px; transform: rotate(-.6deg);
    background: repeating-linear-gradient(180deg, transparent 0 33px, #dbe7f4 33px 34px) 0 25px, #fff;
    box-shadow: 0 14px 30px -18px rgba(60, 40, 10, .55);
    font-family: 'Caveat', cursive; font-size: clamp(23px, 2.8vw, 27px); line-height: 34px; font-weight: 500;
    animation: letterIn .7s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes letterIn { from { opacity: 0; transform: translateY(60px) rotate(3deg) scale(.92); } }
  .letter p { font: inherit; line-height: inherit; margin: 0 0 6px; }
  .letter p.cur::after { content: '✎'; margin-left: 2px; color: var(--pink); }
  .letter .sig { text-align: right; font-weight: 700; color: var(--pink); margin-top: 6px; }

  /* ---------- step 3: questions ---------- */
  .note-slot { position: relative; min-height: 150px; display: flex; align-items: center; justify-content: center; }
  .note {
    position: relative; width: min(100%, 380px); min-height: 140px; padding: 26px 22px 22px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--c, #fff59d); transform: rotate(var(--r, -2deg));
    box-shadow: 0 16px 22px -14px rgba(60, 40, 10, .55);
    font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(28px, 3.8vw, 36px); line-height: 1.15;
  }
  .note::before { content: ''; position: absolute; top: -13px; left: 50%; width: 96px; height: 26px; transform: translateX(-50%) rotate(-3deg); background: repeating-linear-gradient(-45deg, rgba(255, 150, 180, .55) 0 8px, rgba(255, 205, 220, .55) 8px 16px); }
  .note .scribble { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; overflow: visible; }
  .note .scribble path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .note.scribbled .scribble path { transition: stroke-dashoffset .45s ease-in; stroke-dashoffset: 0; }
  .note.fall { animation: fall .55s ease-in forwards; }
  .note.pop { animation: notePop .5s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes fall { to { transform: translate(50px, 160%) rotate(28deg); opacity: 0; } }
  @keyframes notePop { from { transform: scale(.5) rotate(-12deg); opacity: 0; } }
  .split .note-slot { justify-content: flex-start; }
  #yesBtn { font-size: calc(27px * var(--s, 1)); padding: calc(4px * var(--s, 1)) calc(28px * var(--s, 1)) calc(6px * var(--s, 1)); }
  #noBtn { transform: scale(var(--s, 1)); }
  #noBtn:hover { transform: scale(var(--s, 1)) rotate(-1deg); }
  #noBtn.roam { position: fixed; z-index: 30; transition: left .28s ease, top .28s ease, transform .2s ease; }
  .yay { font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(56px, 10vw, 90px); color: var(--pink); line-height: 1; margin-top: 10px; animation: yay .7s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes yay { from { transform: scale(.2) rotate(-20deg); opacity: 0; } }

  /* ---------- step 4: coupons ---------- */
  .coupons { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 26px 20px; margin-top: 22px; }
  .coupon {
    position: relative; text-align: center; padding: 22px 16px 18px; min-height: 150px;
    background: var(--c, #fff59d); transform: rotate(var(--r, -2deg));
    box-shadow: 0 14px 20px -14px rgba(60, 40, 10, .55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    transition: transform .35s ease, opacity .35s ease, box-shadow .2s ease; cursor: pointer;
  }
  .coupon:hover { transform: rotate(0deg) translateY(-4px); box-shadow: 0 20px 26px -14px rgba(60, 40, 10, .6); }
  .coupon .ce { font-size: 38px; line-height: 1; }
  .coupon b { font-family: 'Caveat', cursive; font-size: 28px; line-height: 1.05; }
  .coupon span { font-size: 17px; color: var(--ink-soft); line-height: 1.3; }
  .coupons.picked .coupon:not(.chosen) { opacity: 0; transform: scale(.85) rotate(8deg); pointer-events: none; }
  .coupons.picked { grid-template-columns: minmax(0, 340px); justify-content: center; }
  .coupons.picked .coupon:not(.chosen).out { display: none; }
  .coupon.chosen { transform: rotate(-1deg) scale(1.04); cursor: default; }
  .stamp {
    position: absolute; right: -10px; top: 14px; transform: rotate(14deg);
    border: 3px solid #e2455f; color: #e2455f; border-radius: 6px; padding: 0 10px 2px;
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; background: rgba(255, 255, 255, .7);
    animation: stamp .45s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  @keyframes stamp { from { transform: rotate(14deg) scale(3); opacity: 0; } }
  .final { margin-top: 26px; animation: letterIn .7s ease both; }
  .final .boy { height: clamp(170px, 26vh, 240px); height: clamp(170px, 26dvh, 240px); margin: 0 auto; }

  /* ---------- confetti ---------- */
  .conf { position: fixed; z-index: 50; top: -40px; left: var(--x); width: var(--fs); pointer-events: none; animation: drop var(--d) linear forwards; }
  .conf svg { display: block; width: 100%; height: auto; }
  @keyframes drop { to { transform: translate(var(--dx), 115vh) rotate(var(--rot)); } }

  @media (prefers-reduced-motion: reduce) {
    .env-btn, .tap-hint, .boy.pose-cheer, .boy .b-heart-in { animation: none; }
  }
</style>
</head>
<body>

<!-- shared doodle defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="glowG">
      <stop offset="0" stop-color="#ffc2d3" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffc2d3" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div class="notebook" id="notebook">
  <div class="holes"></div>
  <div class="washi"></div>
  <div class="pg-no">page <span id="pgNo">1</span> / 4</div>

  <!-- 1. hello -->
  <section class="step" data-step="1">
    <div class="inner split">
      <div class="art">
        <svg class="cloud drawable" viewBox="0 0 200 120" aria-hidden="true">
          <g class="ink" filter="url(#wobble)">
            <path d="M40 70 C20 70 18 44 40 42 C42 22 72 18 82 34 C92 14 130 16 132 40 C156 36 170 62 150 72 Z" fill="#eef3f9"/>
            <path class="rain no-draw" d="M62 84 L56 108 M90 86 L84 112 M118 86 L112 110 M144 82 L138 102" fill="none"/>
          </g>
        </svg>
        <div data-boy="pose-hold" id="boyHello"></div>
      </div>
      <div>
        <h1>Hey <span class="hl" data-name></span>…</h1>
        <p>I know you're upset with me, and you have every right to be.</p>
        <div class="sticky" style="--r:-3deg;--c:#ffd1dc">someone has something to say… 👉👈</div>
        <div class="actions">
          <button class="btn btn-pink" id="go2">Turn the page →</button>
        </div>
        <p class="soft small" id="disclose" style="margin-top:18px">✏️ psst… this notebook tells <span data-from></span> what you click</p>
      </div>
    </div>
  </section>

  <!-- 2. letter -->
  <section class="step hidden" data-step="2">
    <div class="inner center">
      <h2>I wrote you something ✉️</h2>
      <button class="env-btn" id="envBtn" aria-label="Open the letter">
        <svg class="drawable" viewBox="0 0 300 210" aria-hidden="true">
          <g class="ink" filter="url(#wobble)" id="envInk">
            <path class="env-back" d="M20 60 L280 60 L280 200 L20 200 Z" fill="#fff1dc"/>
            <g class="env-letter" id="envLetter">
              <path d="M44 70 L256 70 L256 192 L44 192 Z" fill="#ffffff"/>
              <path class="thin" d="M64 92 L236 92 M64 110 L220 110 M64 128 L230 128" fill="none"/>
            </g>
            <path d="M20 60 L150 142 L280 60 L280 200 L20 200 Z" fill="#ffe7c9"/>
            <path class="thin" d="M20 200 L120 128 M280 200 L180 128" fill="none"/>
            <g class="flap" id="flap">
              <path d="M20 60 L280 60 L150 150 Z" fill="#ffd9b0"/>
              <path d="M150 154 C146 150 136 144 136 137 C136 131 142 129 146 131 C148 132 149 134 150 136 C151 134 152 132 154 131 C158 129 164 131 164 137 C164 144 154 150 150 154 Z" fill="#ff6b8b"/>
            </g>
          </g>
        </svg>
      </button>
      <div class="tap-hint" id="tapHint">tap the envelope ✨</div>
      <div class="letter hidden" id="letter">
        <div id="typed" aria-live="polite"></div>
        <p class="sig hidden" id="sig">— <span data-from></span></p>
      </div>
      <div class="actions">
        <button class="link" id="skipBtn" hidden>skip ⏩</button>
        <button class="btn btn-pink hidden" id="go3">Next →</button>
      </div>
    </div>
  </section>

  <!-- 3. questions -->
  <section class="step hidden" data-step="3">
    <div class="inner split">
      <div class="art"><div data-boy="pose-hold" id="boyQ"></div></div>
      <div>
        <div class="note-slot" id="noteSlot"></div>
        <div class="actions" id="askRow">
          <button class="btn btn-pink" id="yesBtn">Yes 💖</button>
          <button class="btn" id="noBtn">No</button>
        </div>
        <div class="yay hidden" id="yay">yay!! 💖</div>
      </div>
    </div>
  </section>

  <!-- 4. coupons -->
  <section class="step hidden" data-step="4">
    <div class="inner center">
      <h2>Pick your sorry coupon 🎟️</h2>
      <p class="soft" id="pickHint">Choose one. I'm good for it, pinky promise 🤙</p>
      <div class="coupons" id="coupons"></div>
      <div class="final hidden" id="final">
        <div data-boy="pose-cheer healed" id="boyEnd"></div>
        <h1 id="finalTitle"></h1>
        <p id="finalSub" class="soft"></p>
        <p class="letter-sig" style="font-family:'Caveat',cursive;font-weight:700;font-size:30px;color:var(--pink);margin:0">— <span data-from></span></p>
      </div>
    </div>

/* =========================================================
   notifications (ntfy.sh) — fire and forget
   ========================================================= */
const track = (() => {
  const counts = {}, sent = {}, onceSent = {}, queued = [];
  const groups = {
    dodge: n => `🏃 Tried to catch the runaway NO ${n} time${n > 1 ? 's' : ''} 😂`
  };
  let timer = null;
  function send(msg, { tags = 'memo', priority = 3 } = {}) {
    if (!CONFIG.ntfyTopic) return;
    const q = `?title=${encodeURIComponent('Sorry notebook ✏️')}&tags=${encodeURIComponent(tags)}&priority=${priority}`;
    try {
      fetch('https://ntfy.sh/' + encodeURIComponent(CONFIG.ntfyTopic) + q, { method: 'POST', body: msg, keepalive: true }).catch(() => {});
    } catch (e) {}
  }
  function schedule() { if (!timer) timer = setTimeout(flush, 10000); }
  function flush() {
    clearTimeout(timer); timer = null;
    const lines = queued.splice(0);
    for (const k in counts) if (counts[k] !== sent[k]) { lines.push(groups[k](counts[k])); sent[k] = counts[k]; }
    if (lines.length) send(lines.join('\n'));
  }
  return {
    now: send,
    once(key, msg, opts) { if (onceSent[key]) return; onceSent[key] = true; send(msg, opts); },
    later(line) { queued.push(line); schedule(); },
    count(kind) { counts[kind] = (counts[kind] || 0) + 1; schedule(); },
    flush
  };
})();

// draw a doodle stroke by stroke
function drawIn(svg) {
  const els = [...svg.querySelectorAll('.ink path, .ink circle, .ink ellipse')].filter(el => !el.classList.contains('no-draw') && !el.closest('.no-draw'));
  els.forEach((el, i) => {
    let len;
    try { len = el.getTotalLength(); } catch (e) { return; }
    if (!len) return;
    const delay = Math.min(i * .035, 1.2);
    el.style.transition = 'none';
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    el.style.fillOpacity = 0;
    el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset .8s ease ${delay}s, fill-opacity .5s ease ${delay + .5}s`;
    el.style.strokeDashoffset = 0;
    el.style.fillOpacity = '';
  });
  setTimeout(() => els.forEach(el => { el.style.transition = ''; el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; }), 2600);
}

function heartSvg(color) {
  return `<svg viewBox="-26 -28 52 46"><path d="${HEART_D}" fill="${color}" stroke="#35333b" stroke-width="2.5" stroke-linejoin="round"/></svg>`;

function confetti(n = 70) {
  const colors = ['#ff7a9c', '#ffd1dc', '#fff59d', '#c8f3d8', '#cfe6ff', '#ffb36b'];

async function sayNo() {
  if (busy || forgiven) return;
  if (q === N - 1) { runaway = true; runAway(); return; }

  note.classList.add('scribbled');

  await sleep(450);
  q++;
  showQuestion();
  busy = false;
}

let lastPointer = { x: -999, y: -999 };
addEventListener('pointermove', e => { lastPointer = { x: e.clientX, y: e.clientY }; }, { passive: true });
function runAway(e) {
  if (e && e.cancelable) e.preventDefault();
  if (forgiven) return;
  if (e && e.clientX != null) lastPointer = { x: e.clientX, y: e.clientY };
  dodges++;
  track.count('dodge');
  noBtn.textContent = CONFIG.runawayLabels[dodges % CONFIG.runawayLabels.length];
  if (!noBtn.classList.contains('roam')) {
    const r = noBtn.getBoundingClientRect();
    noBtn.classList.add('roam');
    document.body.appendChild(noBtn);
    noBtn.style.left = r.left + 'px'; noBtn.style.top = r.top + 'px';
  }
  requestAnimationFrame(() => {
    const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight, w = innerWidth, h = innerHeight;
    const yr = yesBtn.getBoundingClientRect();
    let x, y, tries = 0;
    do {
      x = rand(16, Math.max(16, w - bw - 16)); y = rand(60, Math.max(60, h - bh - 40));
      tries++;
    } while (tries < 30 && (
      (x < yr.right + 20 && x + bw > yr.left - 20 && y < yr.bottom + 20 && y + bh > yr.top - 20) ||
      Math.hypot(x + bw / 2 - lastPointer.x, y + bh / 2 - lastPointer.y) < 160
    ));
    noBtn.style.left = x + 'px'; noBtn.style.top = y + 'px';
  });
}
noBtn.addEventListener('pointerenter', e => { if (runaway && e.pointerType === 'mouse') runAway(e); });
noBtn.addEventListener('pointerdown', e => { if (runaway) runAway(e); });
noBtn.addEventListener('click', e => {
  e.preventDefault();
  if (runaway) { if (e.detail === 0) runAway(); return; }
  sayNo();
});

yesBtn.addEventListener('click', async () => {
  if (forgiven || busy) return;
  forgiven = true;
  noBtn.remove();
  yesBtn.disabled = true;
